name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, parking-service, reservation-service, payment-service, notification-service, poc]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      # Testcontainers uses the Docker daemon that ubuntu-latest runners provide.
      - run: ./mvnw -B verify

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-images:
    name: Build Docker images
    needs: [build-and-test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build

  deploy:
    name: Deploy to local Docker
    needs: docker-images
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build
      - name: Wait for the gateway to report healthy
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && exit 0
            sleep 5
          done
          docker compose ps
          exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run Postman collection
        run: npx --yes newman run postman/smart-parking.postman_collection.json -e postman/local.postman_environment.json
