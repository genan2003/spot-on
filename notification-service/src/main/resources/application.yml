server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_db}
    username: ${DB_USER:smartparking}
    password: ${DB_PASSWORD:smartparking}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # Trace context travels in the message headers, so a trace continues from publisher to consumer.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        # A failing message is retried a few times, then moved to this service's dead-letter queue
        # (MessagingConfig.deadLetterRecoverer) instead of looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

management:
  tracing:
    sampling:
      # Every request is traced, so any demo request can be found in Zipkin (production would sample less).
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info

smartparking:
  notification:
    # Channel for drivers who haven't chosen one (EMAIL, SMS or PUSH; all simulated with logs).
    # A driver's own choice (PATCH /api/v1/notification-preferences/{driverId}) wins.
    default-channel: ${NOTIFICATION_CHANNEL:PUSH}
