name: smart-parking

# Shared settings for the four business services (each still gets its own database).
x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: smartparking
  DB_PASSWORD: smartparking
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  ZIPKIN_URL: http://zipkin:9411

# Healthy once Spring Boot answers /actuator/health with UP. `docker compose up --wait` waits for this,
# so scripts (README, CI smoke test) can call the API as soon as the command returns.
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 30s

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartparking
      POSTGRES_PASSWORD: smartparking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartparking"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Distributed tracing UI (http://localhost:9411). Spans are kept in memory, so they are gone after a restart.
  # No service waits for it: if Zipkin is down, requests still work and only their spans are lost.
  zipkin:
    image: openzipkin/zipkin:3
    ports:
      - "9411:9411"

  parking-service:
    build: ./parking-service
    environment:
      <<: *service-env
      DB_NAME: parking_db
    ports:
      - "8081:8081"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]

  reservation-service:
    build: ./reservation-service
    environment:
      <<: *service-env
      DB_NAME: reservation_db
      PARKING_SERVICE_URL: http://parking-service:8081
      # Demo settings: override from the shell, e.g. RESERVATION_DURATION=1m docker compose up -d
      RESERVATION_DURATION: ${RESERVATION_DURATION:-15m}
      RESERVATION_REMINDER: ${RESERVATION_REMINDER:-5m}
      # How long the circuit breaker to parking-service stays open after repeated failures.
      PARKING_CIRCUIT_OPEN_FOR: ${PARKING_CIRCUIT_OPEN_FOR:-30s}
    ports:
      - "8082:8082"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]

  payment-service:
    build: ./payment-service
    environment:
      <<: *service-env
      DB_NAME: payment_db
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.2}
      # What a new driver finds in the simulated wallet.
      WALLET_STARTING_BALANCE: ${WALLET_STARTING_BALANCE:-25.00}
    ports:
      - "8083:8083"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]

  notification-service:
    build: ./notification-service
    environment:
      <<: *service-env
      DB_NAME: notification_db
      NOTIFICATION_CHANNEL: ${NOTIFICATION_CHANNEL:-PUSH}
    ports:
      - "8084:8084"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]

  gateway:
    build: ./gateway
    environment:
      PARKING_SERVICE_URL: http://parking-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      ZIPKIN_URL: http://zipkin:9411
      # Reservation attempts a driver may make in a row (then one every minute / this number).
      RESERVATION_RATE_LIMIT: ${RESERVATION_RATE_LIMIT:-5}
    ports:
      - "8080:8080"
    depends_on:
      parking-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
