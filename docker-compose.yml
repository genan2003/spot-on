name: smart-parking

# Shared settings for the four business services (each still gets its own database).
x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: smartparking
  DB_PASSWORD: smartparking
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest

# Healthy once Spring Boot answers /actuator/health with UP. `docker compose up --wait` waits for this,
# so scripts (README, CI smoke test) can call the API as soon as the command returns.
x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 30s

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: smartparking
      POSTGRES_PASSWORD: smartparking
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartparking"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  parking-service:
    build: ./parking-service
    environment:
      <<: *service-env
      DB_NAME: parking_db
    ports:
      - "8081:8081"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]

  reservation-service:
    build: ./reservation-service
    environment:
      <<: *service-env
      DB_NAME: reservation_db
      PARKING_SERVICE_URL: http://parking-service:8081
    ports:
      - "8082:8082"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]

  payment-service:
    build: ./payment-service
    environment:
      <<: *service-env
      DB_NAME: payment_db
    ports:
      - "8083:8083"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]

  notification-service:
    build: ./notification-service
    environment:
      <<: *service-env
      DB_NAME: notification_db
    ports:
      - "8084:8084"
    depends_on: *service-deps
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health"]

  gateway:
    build: ./gateway
    environment:
      PARKING_SERVICE_URL: http://parking-service:8081
      RESERVATION_SERVICE_URL: http://reservation-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports:
      - "8080:8080"
    depends_on:
      parking-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  postgres-data:
