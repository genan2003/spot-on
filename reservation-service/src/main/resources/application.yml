server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: reservation-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:reservation_db}
    username: ${DB_USER:smartparking}
    password: ${DB_PASSWORD:smartparking}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failing message is retried a few times, then moved to this service's dead-letter queue
        # (MessagingConfig.deadLetterRecoverer) instead of looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info

smartparking:
  parking-service:
    url: ${PARKING_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 3s
    # Resilience4j (ParkingClientConfig): a failed call (no answer, 5xx) is tried again; when most recent
    # calls fail, the circuit opens and drivers get an immediate 503 instead of waiting for each timeout.
    retry:
      max-attempts: 3
      wait: 300ms
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-calls: 5
      open-for: ${PARKING_CIRCUIT_OPEN_FOR:30s}
  reservation:
    # How long a reserved spot is held before it expires.
    duration: ${RESERVATION_DURATION:15m}
    # The driver is reminded this long before the hold ends (at most half the hold time).
    reminder-before: ${RESERVATION_REMINDER:5m}
    # Reservations expire on time through a TTL queue; this sweep is only the fallback.
    expiry-check: 1m
