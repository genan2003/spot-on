server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /api/v1/spots/** (reserve/occupy/release) is internal: only reservation-service calls it, directly.
            - id: parking-service
              uri: ${PARKING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/parking-locations/**
            # Real-time spot status (WebSocket upgrade is proxied on the same route type)
            - id: parking-service-ws
              uri: ${PARKING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/ws/**
            # Reserving is rate-limited per driver (RateLimitConfig): 429 + Retry-After when a driver tries too often.
            # Listed before reservation-service, so it takes POST /api/v1/reservations; everything else goes on below.
            - id: reserve-spot
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/reservations
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@reservationRateLimiter}"
                    key-resolver: "#{@driverKeyResolver}"
            - id: reservation-service
              uri: ${RESERVATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/reservations/**,/api/v1/parking-sessions/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/payments/**,/api/v1/payment-accounts/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/notifications/**

management:
  tracing:
    sampling:
      # Every request is traced, so any demo request can be found in Zipkin (production would sample less).
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans
  endpoints:
    web:
      exposure:
        include: health,info

smartparking:
  rate-limit:
    reservations:
      # Each driver may try to reserve this many times in a row, then once every period / requests.
      requests: ${RESERVATION_RATE_LIMIT:5}
      period: 1m
