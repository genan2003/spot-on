server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USER:smartparking}
    password: ${DB_PASSWORD:smartparking}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it.
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # A failing message is retried a few times, then dropped (logged) instead of looping forever.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info

smartparking:
  payment:
    # Share of simulated payments that fail, to demo payment.failed (0 = never, 1 = always).
    failure-rate: ${PAYMENT_FAILURE_RATE:0.2}
    # Used for every session: there are no driver accounts with a saved method.
    default-method: CARD
