server {
  listen 80;
  root /usr/share/nginx/html;

  # REST calls and the live spot-status WebSocket go to the gateway.
  location /api/ {
    proxy_pass http://gateway:8080;
  }
  # Live notifications (Server-Sent Events): a long-lived response, passed on as it arrives.
  location /api/v1/notifications/stream {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
  location /ws {
    proxy_pass http://gateway:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Client-side routes (/locations/..., /admin/...) all load the app.
  location / {
    try_files $uri /index.html;
  }
}
